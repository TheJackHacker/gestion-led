<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVASTAR - Cabinet Matrix Calculator</title>
    <style>
        :root {
            --bg-body: #0d1117; --bg-container: #161b22; --text-main: #c9d1d9;
            --primary: #238636; --accent: #58a6ff; --border: #30363d; --input-bg: #0d1117;
        }
        [data-theme="light"] {
            --bg-body: #f6f8fa; --bg-container: #ffffff; --text-main: #24292f;
            --primary: #2da44e; --border: #d0d7de; --input-bg: #ffffff;
        }

        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; background: var(--bg-container); padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .logo { font-weight: 800; font-size: 1.4em; letter-spacing: 1px; }
        
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        label { font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; display: block; color: var(--accent); }
        input, select { width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; outline: none; }
        input:focus { border-color: var(--accent); }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: rgba(88, 166, 255, 0.05); border: 1px solid var(--border); padding: 15px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 10px; opacity: 0.6; display: block; margin-bottom: 5px; }
        .stat-val { font-size: 1.3em; font-weight: 700; }

        .load-container { margin-top: 10px; text-align: left; }
        .progress-bg { background: #30363d; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        .canvas-area { background: #000; padding: 20px; border-radius: 8px; border: 1px solid var(--border); overflow: auto; display: flex; justify-content: center; }
        canvas { box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        .btn { padding: 12px; width: 100%; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .btn:hover { filter: brightness(1.1); }
        .btn-theme { background: transparent; color: var(--text-main); border: 1px solid var(--border); width: auto; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">NOVA<span style="color:var(--accent)">STAR</span> <small style="font-weight: 300;">COEX</small></div>
        <button class="btn btn-theme" onclick="toggleTheme()" id="themeBtn">Modo Claro</button>
    </div>

    <div class="grid-inputs">
        <div><label>Píxeles Panel (H)</label><input type="number" id="pw" value="128" oninput="run()"></div>
        <div><label>Píxeles Panel (V)</label><input type="number" id="ph" value="128" oninput="run()"></div>
        <div><label>Cantidad Columnas</label><input type="number" id="cols" value="8" oninput="run()"></div>
        <div><label>Cantidad Filas</label><input type="number" id="rows" value="4" oninput="run()"></div>
        <div><label>Frecuencia</label>
            <select id="hz" onchange="run()">
                <option value="50">50 Hz</option>
                <option value="60" selected>60 Hz</option>
            </select>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <span class="stat-label">Resolución Pantalla</span>
            <span class="stat-val" id="res">0 x 0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Total Píxeles</span>
            <span class="stat-val" id="totalPx">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Puertos 1G Requeridos</span>
            <span class="stat-val" id="ports" style="color:var(--accent)">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Carga por Puerto (%)</span>
            <span class="stat-val" id="loadTxt">0%</span>
            <div class="progress-bg"><div class="progress-fill" id="loadBar"></div></div>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="mapCanvas"></canvas>
    </div>

    <button class="btn" onclick="exportIMG()">Descargar Imagen Pixel Map</button>
</div>

<script>
    function run() {
        const pw = parseInt(document.getElementById('pw').value) || 1;
        const ph = parseInt(document.getElementById('ph').value) || 1;
        const cols = parseInt(document.getElementById('cols').value) || 1;
        const rows = parseInt(document.getElementById('rows').value) || 1;
        const hz = parseInt(document.getElementById('hz').value);

        // Cálculos
        const totalW = cols * pw;
        const totalH = rows * ph;
        const totalPixels = totalW * totalH;

        // Capacidad NovaStar 1G Ethernet (8-bit)
        // 60Hz: 655,360 píxeles | 50Hz: 786,432 píxeles
        const capacity = (hz === 60) ? 655360 : 786432;
        const ports = Math.ceil(totalPixels / capacity);
        const load = totalPixels > 0 ? (totalPixels / (ports * capacity)) * 100 : 0;

        // Actualizar UI
        document.getElementById('res').innerText = `${totalW} x ${totalH}`;
        document.getElementById('totalPx').innerText = totalPixels.toLocaleString();
        document.getElementById('ports').innerText = totalPixels > 0 ? ports : 0;
        document.getElementById('loadTxt').innerText = load.toFixed(1) + "%";
        
        const bar = document.getElementById('loadBar');
        bar.style.width = load + "%";
        // Color de la barra según carga
        if (load > 92) bar.style.background = "#f85149"; // Crítico
        else if (load > 75) bar.style.background = "#d29922"; // Alto
        else bar.style.background = "#238636"; // Óptimo

        // Dibujar Pixel Map
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = totalW;
        canvas.height = totalH;

        ctx.fillStyle = "#000";
        ctx.fillRect(0,0, totalW, totalH);

        for(let i=0; i<cols; i++) {
            for(let j=0; j<rows; j++) {
                ctx.strokeStyle = "#58a6ff";
                ctx.lineWidth = 1;
                ctx.strokeRect(i*pw, j*ph, pw, ph);
                
                // Marcado de paneles para plano de montaje
                ctx.fillStyle = "rgba(88, 166, 255, 0.2)";
                ctx.font = `bold ${pw/5}px Inter, Arial`;
                ctx.textAlign = "center";
                ctx.fillText(`C${i+1}-F${j+1}`, (i*pw)+(pw/2), (j*ph)+(ph/2));
            }
        }
    }

    function exportIMG() {
        const c = document.getElementById('mapCanvas');
        const link = document.createElement('a');
        link.download = `Novastar_Layout_${c.width}x${c.height}.png`;
        link.href = c.toDataURL();
        link.click();
    }

    function toggleTheme() {
        const d = document.documentElement;
        const isDark = d.getAttribute('data-theme') === 'dark';
        d.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('themeBtn').innerText = isDark ? "Modo Oscuro" : "Modo Claro";
    }

    // Inicializar al cargar
    window.onload = run;
</script>

</body>
</html>
