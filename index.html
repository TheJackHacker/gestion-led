<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora NovaStar - Configuración por Módulos</title>
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-container: #ffffff;
            --text-main: #1a1a1b;
            --text-muted: #5f6368;
            --primary: #0052cc;
            --accent: #e53935;
            --input-bg: #ffffff;
            --border: #dadce0;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e8eaed;
            --text-muted: #9aa0a6;
            --primary: #8ab4f8;
            --accent: #ff8a80;
            --input-bg: #2d2d2d;
            --border: #3c4043;
        }

        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; transition: 0.3s; }
        .container { max-width: 900px; margin: 40px auto; background: var(--bg-container); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 6px solid var(--primary); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-weight: 800; font-size: 1.4em; letter-spacing: 1px; }
        
        .section-title { font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.85em; font-weight: 600; margin-bottom: 8px; }
        
        input, select { 
            padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; 
            background: var(--input-bg); color: var(--text-main); font-size: 1em;
        }

        .results-box { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; 
            background: var(--bg-body); padding: 20px; border-radius: 12px;
        }
        .res-card { text-align: center; padding: 15px; background: var(--bg-container); border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .res-label { font-size: 0.75em; color: var(--text-muted); display: block; margin-bottom: 5px; }
        .res-value { font-size: 1.2em; font-weight: 700; color: var(--primary); }
        .res-value.important { color: var(--accent); }

        /* Switch Estilizado */
        .switch-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .toggle { width: 40px; height: 20px; background: #ccc; border-radius: 20px; position: relative; transition: 0.3s; }
        .toggle::before { content: ""; width: 16px; height: 16px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.3s; }
        input[type="checkbox"]:checked + .toggle { background: var(--primary); }
        input[type="checkbox"]:checked + .toggle::before { transform: translateX(20px); }
        input[type="checkbox"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">NOVA<span style="color:var(--primary)">STAR</span></div>
        <label class="switch-container">
            <span style="font-size: 0.8em;">Modo Oscuro</span>
            <input type="checkbox" id="themeToggle">
            <div class="toggle"></div>
        </label>
    </div>

    <h2 style="margin-top: 0;">Configurador de Pantalla LED</h2>

    <div class="section-title">Datos del Panel (Cabinet)</div>
    <div class="grid">
        <div class="input-group">
            <label>Ancho Panel (mm)</label>
            <input type="number" id="pwMm" value="500" oninput="update()">
        </div>
        <div class="input-group">
            <label>Alto Panel (mm)</label>
            <input type="number" id="phMm" value="500" oninput="update()">
        </div>
        <div class="input-group">
            <label>Píxeles H (px)</label>
            <input type="number" id="pwPx" value="192" oninput="update()">
        </div>
        <div class="input-group">
            <label>Píxeles V (px)</label>
            <input type="number" id="phPx" value="192" oninput="update()">
        </div>
    </div>

    <div class="section-title">Dimensiones de Pantalla Total</div>
    <div class="grid">
        <div class="input-group">
            <label>Ancho Total (Metros)</label>
            <input type="number" id="twM" value="4" step="0.5" oninput="update()">
        </div>
        <div class="input-group">
            <label>Alto Total (Metros)</label>
            <input type="number" id="thM" value="3" step="0.5" oninput="update()">
        </div>
        <div class="input-group">
            <label>Frecuencia de Refresco</label>
            <select id="fps" onchange="update()">
                <option value="50">50 Hz</option>
                <option value="60" selected>60 Hz</option>
            </select>
        </div>
    </div>

    <div class="section-title">Resultados de Ingeniería</div>
    <div class="results-box">
        <div class="res-card">
            <span class="res-label">Cantidad Paneles</span>
            <span class="res-value" id="qtyPanels">0</span>
            <span style="font-size: 0.7em; color: var(--text-muted);" id="matrix">0x0</span>
        </div>
        <div class="res-card">
            <span class="res-label">Resolución Final</span>
            <span class="res-value" id="resFinal">0 x 0</span>
        </div>
        <div class="res-card">
            <span class="res-label">Píxeles Totales</span>
            <span class="res-value" id="totalPx">0</span>
        </div>
        <div class="res-card">
            <span class="res-label">Capacidad de Señal</span>
            <span class="res-value important" id="ports">0 Puertos</span>
            <span style="font-size: 0.7em; color: var(--text-muted);">Cables RJ45</span>
        </div>
    </div>
</div>

<script>
    function update() {
        // Datos del panel
        const pwMm = parseFloat(document.getElementById('pwMm').value) || 1;
        const phMm = parseFloat(document.getElementById('phMm').value) || 1;
        const pwPx = parseInt(document.getElementById('pwPx').value) || 0;
        const phPx = parseInt(document.getElementById('phPx').value) || 0;

        // Dimensiones deseadas (en metros)
        let twM = parseFloat(document.getElementById('twM').value) || 0;
        let thM = parseFloat(document.getElementById('thM').value) || 0;
        const fps = parseInt(document.getElementById('fps').value);

        // Forzar incrementos de 0.5m
        twM = Math.round(twM * 2) / 2;
        thM = Math.round(thM * 2) / 2;

        // Calcular cuántos paneles caben (ajustado al tamaño en mm)
        const panelsH = Math.floor((twM * 1000) / pwMm);
        const panelsV = Math.floor((thM * 1000) / phMm);
        
        const totalPanels = panelsH * panelsV;
        const resH = panelsH * pwPx;
        const resV = panelsV * phPx;
        const totalPixels = resH * resV;

        // Capacidad por puerto (Cálculo NovaStar estándar para 8-bit)
        // 60Hz -> ~655,360 px | 50Hz -> ~786,432 px
        const capacity = (fps === 60) ? 655360 : 786432;
        const portsNeeded = Math.ceil(totalPixels / capacity);

        // Renderizar
        document.getElementById('qtyPanels').innerText = totalPanels;
        document.getElementById('matrix').innerText = `${panelsH} Horiz. x ${panelsV} Vert.`;
        document.getElementById('resFinal').innerText = `${resH} x ${resV}`;
        document.getElementById('totalPx').innerText = totalPixels.toLocaleString();
        document.getElementById('ports').innerText = (totalPixels > 0) ? `${portsNeeded} Puerto${portsNeeded > 1 ? 's' : ''}` : "0 Puertos";
    }

    // Modo Oscuro
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('change', () => {
        const theme = themeToggle.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
    });

    // Inicializar
    update();
</script>

</body>
</html>
