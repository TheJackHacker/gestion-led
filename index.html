<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaStar COEX - Pixel & Load Calculator</title>
    <style>
        :root {
            --bg-body: #0a0c10; --bg-container: #161b22; --text-main: #c9d1d9;
            --primary: #1f6feb; --accent: #39d353; --border: #30363d; --input-bg: #0d1117;
        }
        [data-theme="light"] {
            --bg-body: #f6f8fa; --bg-container: #ffffff; --text-main: #24292f;
            --primary: #0969da; --border: #d0d7de; --input-bg: #ffffff;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; background: var(--bg-container); padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .logo { font-weight: 700; font-size: 1.4em; color: var(--primary); }
        
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        label { font-size: 12px; font-weight: 600; margin-bottom: 8px; display: block; opacity: 0.9; }
        input, select { width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; outline: none; }
        input:focus { border-color: var(--primary); ring: 2px rgba(31,111,235,0.3); }

        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--input-bg); border: 1px solid var(--border); padding: 15px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 11px; text-transform: uppercase; opacity: 0.7; margin-bottom: 5px; display: block; }
        .stat-val { font-size: 1.4em; font-weight: 700; color: var(--primary); }

        .load-zone { margin-top: 10px; }
        .bar-bg { background: #30363d; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; background: var(--accent); width: 0%; transition: 0.5s ease-out; }

        .canvas-wrapper { background: #000; padding: 20px; border-radius: 8px; overflow: auto; border: 1px solid var(--border); margin-bottom: 20px; }
        canvas { display: block; margin: auto; }

        .btn { padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; background: var(--primary); color: white; width: 100%; }
        .btn-theme { background: transparent; color: var(--text-main); width: auto; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">NOVA<span style="color:var(--text-main)">STAR</span> <span style="font-weight: 300; font-size: 0.8em;">COEX CALC</span></div>
        <button class="btn btn-theme" onclick="toggleTheme()" id="themeBtn">Modo Claro</button>
    </div>

    <div class="grid-inputs">
        <div><label>Píxeles Panel (H)</label><input type="number" id="pw" value="128" oninput="calculate()"></div>
        <div><label>Píxeles Panel (V)</label><input type="number" id="ph" value="128" oninput="calculate()"></div>
        <div><label>Ancho Pantalla (m)</label><input type="number" id="tw" value="4.0" step="0.1" oninput="calculate()"></div>
        <div><label>Alto Pantalla (m)</label><input type="number" id="th" value="2.0" step="0.1" oninput="calculate()"></div>
        <div><label>Frecuencia (Hz)</label>
            <select id="hz" onchange="calculate()">
                <option value="50">50 Hz</option>
                <option value="60" selected>60 Hz</option>
            </select>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-card"><span class="stat-label">Resolución Final</span><span class="stat-val" id="res">0 x 0</span></div>
        <div class="stat-card"><span class="stat-label">Total Píxeles</span><span class="stat-val" id="totalPx">0</span></div>
        <div class="stat-card"><span class="stat-label">Puertos de Red</span><span class="stat-val" id="ports">0</span></div>
        <div class="stat-card">
            <span class="stat-label">Carga del Sistema</span>
            <span class="stat-val" id="loadPerc" style="color:var(--accent)">0%</span>
            <div class="bar-bg"><div class="bar-fill" id="loadBar"></div></div>
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="mapCanvas"></canvas>
    </div>

    <button class="btn" onclick="exportPNG()">Exportar Pixel Map</button>
</div>

<script>
    function calculate() {
        const pw = parseInt(document.getElementById('pw').value) || 1;
        const ph = parseInt(document.getElementById('ph').value) || 1;
        const tw = parseFloat(document.getElementById('tw').value) || 0;
        const th = parseFloat(document.getElementById('th').value) || 0;
        const hz = parseInt(document.getElementById('hz').value);

        // Lógica: Asumimos que 1m equivale a una proporción estándar para el cálculo visual 
        // (En configuración real, el número de paneles lo define el usuario según el diseño)
        // Aquí estimamos paneles basándonos en una densidad de 500mm por panel para el dibujo
        const cols = Math.max(1, Math.round(tw / 0.5));
        const rows = Math.max(1, Math.round(th / 0.5));
        
        const totalW = cols * pw;
        const totalH = rows * ph;
        const totalPixels = totalW * totalH;

        // Capacidad por puerto 1G NovaStar
        const capacity = (hz === 60) ? 655360 : 786432;
        const ports = Math.ceil(totalPixels / capacity);
        const load = totalPixels > 0 ? (totalPixels / (ports * capacity)) * 100 : 0;

        // UI
        document.getElementById('res').innerText = `${totalW} x ${totalH}`;
        document.getElementById('totalPx').innerText = totalPixels.toLocaleString();
        document.getElementById('ports').innerText = totalPixels > 0 ? ports : 0;
        document.getElementById('loadPerc').innerText = load.toFixed(1) + "%";
        
        const bar = document.getElementById('loadBar');
        bar.style.width = load + "%";
        bar.style.background = load > 90 ? "#f85149" : (load > 75 ? "#dbab09" : "#39d353");

        // Canvas
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = totalW;
        canvas.height = totalH;

        ctx.fillStyle = "#000";
        ctx.fillRect(0,0, totalW, totalH);
        
        for(let i=0; i<cols; i++) {
            for(let j=0; j<rows; j++) {
                ctx.strokeStyle = "#1f6feb";
                ctx.lineWidth = 1;
                ctx.strokeRect(i*pw, j*ph, pw, ph);
                
                ctx.fillStyle = "rgba(255,255,255,0.1)";
                ctx.font = `${pw/5}px Arial`;
                ctx.textAlign = "center";
                ctx.fillText(`${i+1}-${j+1}`, (i*pw)+(pw/2), (j*ph)+(ph/2));
            }
        }
    }

    function exportPNG() {
        const c = document.getElementById('mapCanvas');
        const link = document.createElement('a');
        link.download = `Novastar_Map_${c.width}x${c.height}.png`;
        link.href = c.toDataURL();
        link.click();
    }

    function toggleTheme() {
        const d = document.documentElement;
        const isDark = d.getAttribute('data-theme') === 'dark';
        d.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('themeBtn').innerText = isDark ? "Modo Oscuro" : "Modo Claro";
    }

    window.onload = calculate;
</script>

</body>
</html>
