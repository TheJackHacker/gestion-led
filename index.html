<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaStar Pro - Pixel Map Generator</title>
    <style>
        :root {
            --bg-body: #121212; --bg-container: #1e1e1e; --text-main: #e8eaed;
            --primary: #0052cc; --accent: #ff8a80; --border: #3c4043;
        }
        [data-theme="light"] {
            --bg-body: #f0f2f5; --bg-container: #ffffff; --text-main: #1a1a1b;
            --primary: #0052cc; --border: #dadce0;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; transition: 0.3s; }
        .container { max-width: 1100px; margin: auto; background: var(--bg-container); padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        
        label { font-size: 0.8em; font-weight: bold; display: block; margin-bottom: 5px; color: var(--primary); }
        input, select { width: 100%; padding: 10px; background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); border-radius: 5px; box-sizing: border-box; }
        
        .map-container { 
            background: #000; padding: 20px; border-radius: 8px; overflow: auto; 
            display: flex; flex-direction: column; align-items: center; border: 2px solid var(--primary);
        }
        canvas { max-width: 100%; height: auto; background: #111; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-export { background: var(--primary); color: white; }
        .btn-export:hover { opacity: 0.8; }
        
        .stats { display: flex; justify-content: space-around; background: var(--bg-body); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em; }
        .stat-item span { display: block; text-align: center; }
        .stat-val { font-weight: bold; color: var(--accent); font-size: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="font-weight: 900; font-size: 1.5em;">NOVA<span style="color:var(--primary)">STAR</span> <small style="font-weight:100; font-size: 0.6em;">PIXEL MAPPER</small></div>
        <button class="btn" onclick="toggleTheme()" id="themeBtn">Modo Claro</button>
    </div>

    <div class="grid-inputs">
        <div><label>Ancho Panel (px)</label><input type="number" id="pw" value="128" oninput="drawMap()"></div>
        <div><label>Alto Panel (px)</label><input type="number" id="ph" value="128" oninput="drawMap()"></div>
        <div><label>Ancho Pantalla (m)</label><input type="number" id="tw" value="4" step="0.5" oninput="drawMap()"></div>
        <div><label>Alto Pantalla (m)</label><input type="number" id="th" value="2.5" step="0.5" oninput="drawMap()"></div>
        <div><label>Panel mm (H)</label><input type="number" id="pmH" value="500" oninput="drawMap()"></div>
        <div><label>Panel mm (V)</label><input type="number" id="pmV" value="500" oninput="drawMap()"></div>
    </div>

    <div class="stats">
        <div class="stat-item"><span>Resolución Total</span><span class="stat-val" id="totalRes">0 x 0</span></div>
        <div class="stat-item"><span>Matriz Paneles</span><span class="stat-val" id="matrix">0 x 0</span></div>
        <div class="stat-item"><span>Total Paneles</span><span class="stat-val" id="totalPanels">0</span></div>
    </div>

    <div class="map-container">
        <canvas id="pixelCanvas"></canvas>
        <div class="controls">
            <button class="btn btn-export" onclick="exportImage()">Descargar Pixel Map (.PNG)</button>
        </div>
    </div>
</div>

<script>
    function drawMap() {
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        
        // Entradas
        const pw = parseInt(document.getElementById('pw').value) || 0;
        const ph = parseInt(document.getElementById('ph').value) || 0;
        const pmH = parseInt(document.getElementById('pmH').value) || 1;
        const pmV = parseInt(document.getElementById('pmV').value) || 1;
        let tw = parseFloat(document.getElementById('tw').value) || 0;
        let th = parseFloat(document.getElementById('th').value) || 0;

        // Forzar incrementos de 0.5m
        tw = Math.round(tw * 2) / 2;
        th = Math.round(th * 2) / 2;

        const cols = Math.floor((tw * 1000) / pmH);
        const rows = Math.floor((th * 1000) / pmV);
        
        const totalW = cols * pw;
        const totalH = rows * ph;

        // Actualizar Stats
        document.getElementById('totalRes').innerText = `${totalW} x ${totalH}`;
        document.getElementById('matrix').innerText = `${cols} x ${rows}`;
        document.getElementById('totalPanels').innerText = cols * rows;

        // Ajustar tamaño del canvas al pixel real de la pantalla LED
        canvas.width = totalW;
        canvas.height = totalH;

        // Dibujar Paneles
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, totalW, totalH);

        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                // Color alternado para distinguir paneles (estilo NovaStar VMP)
                ctx.strokeStyle = "#0052cc";
                ctx.lineWidth = 1;
                ctx.strokeRect(i * pw, j * ph, pw, ph);
                
                // Añadir texto de coordenadas en el centro de cada panel
                ctx.fillStyle = "#333";
                ctx.font = `${pw/6}px Arial`;
                ctx.textAlign = "center";
                ctx.fillText(`P${i+1},${j+1}`, (i * pw) + pw/2, (j * ph) + ph/2);
            }
        }
        
        // Borde exterior fuerte
        ctx.strokeStyle = "#0052cc";
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, totalW, totalH);
    }

    function exportImage() {
        const canvas = document.getElementById('pixelCanvas');
        const link = document.createElement('a');
        link.download = `pixelmap_novastar_${canvas.width}x${canvas.height}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }

    function toggleTheme() {
        const doc = document.documentElement;
        const btn = document.getElementById('themeBtn');
        if (doc.getAttribute('data-theme') === 'dark') {
            doc.setAttribute('data-theme', 'light');
            btn.innerText = "Modo Oscuro";
        } else {
            doc.setAttribute('data-theme', 'dark');
            btn.innerText = "Modo Claro";
        }
    }

    // Inicializar
    window.onload = drawMap;
</script>

</body>
</html>
