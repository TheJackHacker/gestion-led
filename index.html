<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Pixelmaps</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        input, select, button {
            padding: 8px;
            background: #444;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }
        button {
            cursor: pointer;
            background: #007bff;
            border: none;
        }
        button:hover {
            background: #0056b3;
        }
        .canvas-container {
            border: 2px dashed #555;
            background-color: #000;
            overflow: auto; /* Por si el canvas es muy grande */
            max-width: 95vw;
            max-height: 75vh;
        }
        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div>
            <label for="resolutions">Resolución Base:</label>
            <select id="resolutions">
                <option value="1920,1080">Full HD (1920x1080)</option>
                <option value="3840,2160">4K (3840x2160)</option>
                <option value="custom">Custom</option>
            </select>
        </div>
        <div id="custom-res" style="display: none;">
            <input type="number" id="custom-w" placeholder="Ancho (px)" value="1000">
            x
            <input type="number" id="custom-h" placeholder="Alto (px)" value="1000">
            <button id="apply-custom">Aplicar</button>
        </div>
        <div>
            <label for="image-upload">Importar Pixelmaps (PNG):</label>
            <input type="file" id="image-upload" accept="image/png" multiple>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="mappingCanvas" width="1920" height="1080"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mappingCanvas');
        const ctx = canvas.getContext('2d');
        const uploadInput = document.getElementById('image-upload');
        const resSelect = document.getElementById('resolutions');
        const customResDiv = document.getElementById('custom-res');
        const applyCustomBtn = document.getElementById('apply-custom');

        let pixelmaps = []; // Almacena las imágenes y sus coordenadas
        let isDragging = false;
        let dragIndex = -1;
        let startX, startY;

        // Cambiar resolución del Canvas
        resSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customResDiv.style.display = 'block';
            } else {
                customResDiv.style.display = 'none';
                const [w, h] = e.target.value.split(',');
                resizeCanvas(parseInt(w), parseInt(h));
            }
        });

        applyCustomBtn.addEventListener('click', () => {
            const w = document.getElementById('custom-w').value;
            const h = document.getElementById('custom-h').value;
            resizeCanvas(w, h);
        });

        function resizeCanvas(width, height) {
            canvas.width = width;
            canvas.height = height;
            draw(); // Redibujar todo al cambiar el tamaño
        }

        // Cargar múltiples PNGs
        uploadInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            files.forEach(file => {
                if (file.type !== 'image/png') return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        // Colocar la imagen en una posición inicial en cascada
                        const offset = pixelmaps.length * 20; 
                        pixelmaps.push({
                            img: img,
                            x: 50 + offset,
                            y: 50 + offset,
                            width: img.width,
                            height: img.height
                        });
                        draw();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        // Función principal de renderizado
        function draw() {
            // Limpiar canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar rejilla de fondo opcional (para referencia)
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Dibujar todos los pixelmaps
            pixelmaps.forEach((map) => {
                ctx.drawImage(map.img, map.x, map.y, map.width, map.height);
            });
        }

        // Lógica de Mouse: Arrastrar y soltar
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            // Calcular posición del mouse respecto al canvas considerando scroll/escalado
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Buscar si hicimos clic en alguna imagen (de arriba hacia abajo visualmente)
            for (let i = pixelmaps.length - 1; i >= 0; i--) {
                let map = pixelmaps[i];
                if (mouseX >= map.x && mouseX <= map.x + map.width &&
                    mouseY >= map.y && mouseY <= map.y + map.height) {
                    
                    isDragging = true;
                    dragIndex = i;
                    // Guardar el desfase entre el clic y la esquina superior izquierda de la imagen
                    startX = mouseX - map.x;
                    startY = mouseY - map.y;
                    
                    // Traer la imagen seleccionada al frente del array (renderizar encima)
                    const selectedMap = pixelmaps.splice(i, 1)[0];
                    pixelmaps.push(selectedMap);
                    dragIndex = pixelmaps.length - 1;
                    
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Actualizar coordenadas basándose en el punto de anclaje (startX, startY)
            pixelmaps[dragIndex].x = mouseX - startX;
            pixelmaps[dragIndex].y = mouseY - startY;

            draw(); // Renderizar movimiento en tiempo real
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; dragIndex = -1; });
        canvas.addEventListener('mouseout', () => { isDragging = false; dragIndex = -1; });

        // Dibujo inicial
        draw();
    </script>
</body>
</html>
