<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador y Posicionador de Pixelmaps</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Lateral / Sidebar */
        .sidebar {
            width: 340px;
            background-color: #1a1a1e;
            border-right: 1px solid #29292e;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        h2 {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
            color: #04d361;
            border-bottom: 1px solid #29292e;
            padding-bottom: 10px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 12px;
            font-weight: bold;
            color: #8d8d99;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
            color: #c4c4cc;
        }
        select, input[type="number"], input[type="file"], button {
            width: 100%;
            background-color: #202024;
            border: 1px solid #29292e;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input[type="number"]:focus {
            border-color: #04d361;
        }
        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row > div {
            flex: 1;
        }
        
        /* Lista de capas / Pixelmaps */
        .layers-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .layer-item {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 6px;
            padding: 12px;
        }
        .layer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        .layer-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .btn-delete {
            background: none;
            border: none;
            color: #f75a68;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            width: auto;
        }
        .btn-delete:hover {
            text-decoration: underline;
        }
        
        /* Boton exportar */
        .btn-primary {
            background-color: #04d361;
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: auto;
            padding: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-primary:hover {
            background-color: #00b34d;
        }

        /* Contenedor Principal Canvas */
        .main-content {
            flex: 1;
            background-color: #09090a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }
        .canvas-wrapper {
            background-color: #000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #29292e;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* El Canvas se escala visualmente, pero su resolución interna se mantiene intacta */
        canvas {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain; 
            display: block;
            /* Fondo cuadriculado transparente (estilo Photoshop) para ver límites */
            background-image: linear-gradient(45deg, #111 25%, transparent 25%), 
                              linear-gradient(-45deg, #111 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #111 75%), 
                              linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .info-bar {
            position: absolute;
            bottom: 20px;
            background-color: rgba(26, 26, 30, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #8d8d99;
            border: 1px solid #29292e;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Fricción Zero Setup</h2>
        
        <div class="section">
            <span class="section-title">Lienzo Principal</span>
            <div class="control-group">
                <label for="resolutions">Resolución Base</label>
                <select id="resolutions">
                    <option value="1920,1080">Full HD (1920x1080)</option>
                    <option value="3840,2160">4K UHD (3840x2160)</option>
                    <option value="custom">Personalizado (Custom)</option>
                </select>
            </div>
            <div id="custom-res-inputs" style="display: none;" class="control-group">
                <div class="row">
                    <div>
                        <label>Ancho (px)</label>
                        <input type="number" id="canvas-w" value="1920" min="1">
                    </div>
                    <div>
                        <label>Alto (px)</label>
                        <input type="number" id="canvas-h" value="1080" min="1">
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <span class="section-title">Importar Módulos</span>
            <div class="control-group">
                <label for="image-upload">Cargar Pixelmap (PNG)</label>
                <input type="file" id="image-upload" accept="image/png">
            </div>
        </div>

        <div class="section" style="flex: 1; display: flex; flex-direction: column;">
            <span class="section-title">Archivos Cargados</span>
            <div class="layers-list" id="layers-list">
                </div>
        </div>

        <button class="btn-primary" id="btn-export">Exportar Canvas a PNG</button>
    </div>

    <div class="main-content">
        <div class="canvas-wrapper">
            <canvas id="mainCanvas" width="1920" height="1080"></canvas>
        </div>
        <div class="info-bar" id="info-bar">
            Resolución actual: 1920 x 1080 px
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const resolutionsSelect = document.getElementById('resolutions');
        const customResInputs = document.getElementById('custom-res-inputs');
        const canvasWInput = document.getElementById('canvas-w');
        const canvasHInput = document.getElementById('canvas-h');
        const imageUpload = document.getElementById('image-upload');
        const layersListContainer = document.getElementById('layers-list');
        const btnExport = document.getElementById('btn-export');
        const infoBar = document.getElementById('info-bar');

        let loadedMaps = []; // Array principal que guarda la información

        // 1. Gestionar el tamaño del Canvas
        function updateCanvasSize() {
            let w, h;
            if (resolutionsSelect.value === 'custom') {
                customResInputs.style.display = 'block';
                w = parseInt(canvasWInput.value) || 1920;
                h = parseInt(canvasHInput.value) || 1080;
            } else {
                customResInputs.style.display = 'none';
                const parts = resolutionsSelect.value.split(',');
                w = parseInt(parts[0]);
                h = parseInt(parts[1]);
                canvasWInput.value = w;
                canvasHInput.value = h;
            }
            // Cambiar tamaño real del canvas (no el visual)
            canvas.width = w;
            canvas.height = h;
            infoBar.textContent = `Resolución actual: ${w} x ${h} px`;
            render(); // Al redimensionar, volvemos a dibujar
        }

        resolutionsSelect.addEventListener('change', updateCanvasSize);
        canvasWInput.addEventListener('input', updateCanvasSize);
        canvasHInput.addEventListener('input', updateCanvasSize);

        // 2. Subir archivo individual
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || file.type !== 'image/png') return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Generar un ID único y guardar la data
                    const newMap = {
                        id: Date.now() + Math.random().toString(36).substring(2, 5),
                        name: file.name,
                        img: img,
                        x: 0, // Inicia siempre en 0,0
                        y: 0,
                        width: img.width,
                        height: img.height
                    };
                    loadedMaps.push(newMap);
                    imageUpload.value = ''; // Resetear el input para permitir subir el mismo archivo de nuevo si se necesita
                    updateLayersUI();
                    render();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 3. Generar la interfaz del menú lateral (Listado)
        function updateLayersUI() {
            layersListContainer.innerHTML = ''; // Limpiar la lista
            
            if (loadedMaps.length === 0) {
                layersListContainer.innerHTML = '<div style="font-size:13px; color:#52525b; text-align:center; padding:20px;">Ningún archivo cargado</div>';
                return;
            }

            // Recorrer los mapas cargados para crear los controles
            loadedMaps.forEach((map) => {
                const item = document.createElement('div');
                item.className = 'layer-item';
                item.innerHTML = `
                    <div class="layer-header">
                        <span class="layer-name" title="${map.name}">${map.name}</span>
                        <button class="btn-delete" data-id="${map.id}">Quitar</button>
                    </div>
                    <div style="font-size: 11px; color:#8d8d99; margin-bottom:6px;">
                        Resolución nativa: ${map.width}x${map.height} px
                    </div>
                    <div class="row">
                        <div>
                            <label>X (px)</label>
                            <input type="number" class="coord-input" data-id="${map.id}" data-coord="x" value="${map.x}">
                        </div>
                        <div>
                            <label>Y (px)</label>
                            <input type="number" class="coord-input" data-id="${map.id}" data-coord="y" value="${map.y}">
                        </div>
                    </div>
                `;
                layersListContainer.appendChild(item);
            });

            // Dar funcionalidad a los inputs numéricos de coordenadas
            document.querySelectorAll('.coord-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const coord = e.target.getAttribute('data-coord');
                    const value = parseInt(e.target.value) || 0; // Prevenir NaN
                    
                    const targetMap = loadedMaps.find(m => m.id === id);
                    if (targetMap) {
                        targetMap[coord] = value; // Actualizar la coordenada X o Y
                        render(); // Redibujar al instante
                    }
                });
            });

            // Dar funcionalidad al botón de eliminar
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    loadedMaps = loadedMaps.filter(m => m.id !== id);
                    updateLayersUI();
                    render();
                });
            });
        }

        // 4. Renderizar: Dibujar todo en el canvas
        function render() {
            // Limpiar el lienzo antes de cada redibujado
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar cada imagen respetando sus coordenadas actuales
            loadedMaps.forEach(map => {
                ctx.drawImage(map.img, map.x, map.y, map.width, map.height);
            });
        }

        // 5. Exportar Canvas final
        btnExport.addEventListener('click', () => {
            if (loadedMaps.length === 0) {
                alert('No hay pixelmaps en el lienzo para exportar.');
                return;
            }
            
            // Forzar un render limpio (por si acaso)
            render();
            
            // Crear enlace temporal de descarga
            const link = document.createElement('a');
            link.download = `canvas_exportado_${canvas.width}x${canvas.height}.png`;
            // El canvas.toDataURL exporta los píxeles reales, independientemente del zoom de pantalla
            link.href = canvas.toDataURL('image/png'); 
            link.click();
        });

        // Inicialización al abrir la página
        updateCanvasSize();
    </script>
</body>
</html>
