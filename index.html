<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVASTAR - Designer Pixel Mapper</title>
    <style>
        :root {
            --bg-body: #0d1117; --bg-container: #161b22; --text-main: #c9d1d9;
            --primary: #30363d; --accent: #58a6ff; --border: #444c56; --input-bg: #0d1117;
        }
        [data-theme="light"] {
            --bg-body: #f6f8fa; --bg-container: #ffffff; --text-main: #24292f;
            --primary: #d0d7de; --border: #afb8c1; --input-bg: #ffffff;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 15px; transition: 0.3s; }
        .container { max-width: 1200px; margin: auto; background: var(--bg-container); padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .logo { font-weight: 800; font-size: 1.2em; color: var(--accent); letter-spacing: 1px; }
        
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        label { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; display: block; color: var(--text-main); opacity: 0.7; }
        input, select { width: 100%; padding: 8px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; outline: none; font-size: 13px; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 9px; opacity: 0.5; display: block; margin-bottom: 3px; text-transform: uppercase; }
        .stat-val { font-size: 1.2em; font-weight: 700; color: var(--accent); }

        .progress-bg { background: #30363d; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; background: #58a6ff; width: 0%; transition: 0.5s; }

        .canvas-area { 
            background: #1a1a1a; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
        }

        canvas { 
            max-width: 100%; 
            height: auto !important; 
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            image-rendering: auto;
        }

        .btn { padding: 12px; width: 100%; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .btn:hover { background: #4592ef; transform: translateY(-1px); }
        .btn-theme { background: transparent; color: var(--text-main); border: 1px solid var(--border); width: auto; font-size: 0.75em; padding: 5px 10px; margin-top: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">NOVA<span style="color:var(--text-main)">STAR</span> <span style="font-weight: 300; font-size: 0.8em;">PIXEL MAPPER</span></div>
        <button class="btn btn-theme" onclick="toggleTheme()" id="themeBtn">Modo Claro</button>
    </div>

    <div class="grid-inputs">
        <div><label>Píxeles Panel (H)</label><input type="number" id="pw" value="192" oninput="run()"></div>
        <div><label>Píxeles Panel (V)</label><input type="number" id="ph" value="192" oninput="run()"></div>
        <div><label>Nº Columnas</label><input type="number" id="cols" value="12" oninput="run()"></div>
        <div><label>Nº Filas</label><input type="number" id="rows" value="6" oninput="run()"></div>
        <div><label>Frecuencia</label>
            <select id="hz" onchange="run()">
                <option value="50">50 Hz</option>
                <option value="60" selected>60 Hz</option>
            </select>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card"><span class="stat-label">Resolución Nativa</span><span class="stat-val" id="res">0 x 0</span></div>
        <div class="stat-card"><span class="stat-label">Píxeles Totales</span><span class="stat-val" id="totalPx">0</span></div>
        <div class="stat-card"><span class="stat-label">Puertos 1G Requeridos</span><span class="stat-val" id="ports">0</span></div>
        <div class="stat-card">
            <span class="stat-label">Carga del Sistema</span>
            <span class="stat-val" id="loadTxt">0%</span>
            <div class="progress-bg"><div class="progress-fill" id="loadBar"></div></div>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="mapCanvas"></canvas>
    </div>

    <button class="btn" onclick="exportIMG()">Descargar Pixel Map de Alta Calidad</button>
</div>

<script>
    function run() {
        const pw = parseInt(document.getElementById('pw').value) || 1;
        const ph = parseInt(document.getElementById('ph').value) || 1;
        const cols = parseInt(document.getElementById('cols').value) || 1;
        const rows = parseInt(document.getElementById('rows').value) || 1;
        const hz = parseInt(document.getElementById('hz').value);

        const totalW = cols * pw;
        const totalH = rows * ph;
        const totalPixels = totalW * totalH;

        const capacity = (hz === 60) ? 655360 : 786432;
        const ports = Math.ceil(totalPixels / capacity);
        const load = totalPixels > 0 ? (totalPixels / (ports * capacity)) * 100 : 0;

        document.getElementById('res').innerText = `${totalW} x ${totalH}`;
        document.getElementById('totalPx').innerText = totalPixels.toLocaleString();
        document.getElementById('ports').innerText = totalPixels > 0 ? ports : 0;
        document.getElementById('loadTxt').innerText = load.toFixed(1) + "%";
        
        const bar = document.getElementById('loadBar');
        bar.style.width = load + "%";
        bar.style.background = load > 92 ? "#f85149" : (load > 75 ? "#d29922" : "#39d353");

        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = totalW;
        canvas.height = totalH;

        ctx.fillStyle = "#111";
        ctx.fillRect(0,0, totalW, totalH);

        for(let i=0; i<cols; i++) {
            for(let j=0; j<rows; j++) {
                // Alternancia de colores en escala de grises (Chessboard pattern)
                const isEven = (i + j) % 2 === 0;
                ctx.fillStyle = isEven ? "#2a2a2a" : "#1f1f1f";
                
                const x = i * pw;
                const y = j * ph;

                // Dibujar el cuerpo del módulo
                ctx.fillRect(x, y, pw, ph);
                
                // Borde interior sutil
                ctx.strokeStyle = "rgba(255,255,255,0.05)";
                ctx.lineWidth = 1;
                ctx.strokeRect(x + 1, y + 1, pw - 2, ph - 2);

                // Coordenadas en la parte inferior
                const padding = ph * 0.1;
                const fontSize = Math.max(10, ph / 12);
                ctx.fillStyle = "rgba(255,255,255,0.5)";
                ctx.font = `600 ${fontSize}px 'Inter', sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                
                // Texto: C-F (Columna-Fila)
                ctx.fillText(`C${i+1} : F${j+1}`, x + (pw/2), y + ph - padding);
                
                // Indicador visual de esquina (opcional, para diseño)
                ctx.strokeStyle = "rgba(88, 166, 255, 0.2)";
                ctx.beginPath();
                ctx.moveTo(x + 5, y + 5);
                ctx.lineTo(x + 15, y + 5);
                ctx.moveTo(x + 5, y + 5);
                ctx.lineTo(x + 5, y + 15);
                ctx.stroke();
            }
        }
        
        // Marco exterior
        ctx.strokeStyle = "#444";
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, totalW, totalH);
    }

    function exportIMG() {
        const c = document.getElementById('mapCanvas');
        const link = document.createElement('a');
        link.download = `NovaStar_PixelMap_${c.width}x${c.height}.png`;
        link.href = c.toDataURL("image/png");
        link.click();
    }

    function toggleTheme() {
        const d = document.documentElement;
        const isDark = d.getAttribute('data-theme') === 'dark';
        d.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('themeBtn').innerText = isDark ? "Modo Oscuro" : "Modo Claro";
    }

    window.onload = run;
</script>

</body>
</html>
